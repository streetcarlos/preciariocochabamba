<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Fondo corporativo en rojo -->
  <rect width="400" height="400" rx="90" fill="#cc0000" />
  
  <!-- Texto Superior -->
  <text x="200" y="85" font-family="Montserrat, Arial, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle">IMPORTADORA</text>
  
  <!-- DIBUJO VECTORIAL DEL GLOBO DE SUSPENSIÓN (Basado en la imagen) -->
  <g transform="translate(0, -15)">
      <!-- Pernos superiores de anclaje -->
      <rect x="175" y="115" width="10" height="15" fill="#ffffff" />
      <rect x="215" y="115" width="10" height="15" fill="#ffffff" />
      
      <!-- Tapa metálica superior -->
      <rect x="150" y="130" width="100" height="15" rx="4" fill="#ffffff" />
      
      <!-- Anillos de goma del globo (Pulmón) -->
      <!-- Anillo Superior -->
      <ellipse cx="200" cy="170" rx="65" ry="30" fill="#ffffff" />
      
      <!-- Anillo Medio (con borde rojo para simular los pliegues de goma) -->
      <ellipse cx="200" cy="215" rx="75" ry="35" fill="#ffffff" stroke="#cc0000" stroke-width="5" />
      
      <!-- Anillo Inferior -->
      <ellipse cx="200" cy="260" rx="65" ry="30" fill="#ffffff" stroke="#cc0000" stroke-width="5" />
      
      <!-- Base metálica inferior -->
      <rect x="160" y="285" width="80" height="15" rx="4" fill="#ffffff" />
      
      <!-- Perno inferior central -->
      <rect x="190" y="300" width="20" height="15" fill="#ffffff" />
  </g>
  
  <!-- Texto Inferior -->
  <text x="200" y="365" font-family="'Arial Black', Impact, sans-serif" font-size="75" font-weight="900" fill="#ffffff" letter-spacing="5" text-anchor="middle">CALI</text>
</svg>
